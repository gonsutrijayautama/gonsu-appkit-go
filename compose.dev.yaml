# Database dan object storage untuk `make test`. Port host bawaan 15442
# (database) dan 15480 (S3); ubah lewat DEV_DB_PORT dan DEV_S3_PORT bila
# bentrok: DEV_DB_PORT=15443 make test.
name: gonsu-appkit-go

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15442}:5432"
    # Tanpa volume: setiap test membuat dan menghapus databasenya sendiri.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Layanan berbicara S3 untuk test media/s3store. S3Proxy memeriksa tanda
  # tangan permintaan dan menolak header yang tidak dikenalnya — sama ketatnya
  # dengan penyedia yang bukan AWS. Identitas di bawah hanya berlaku di sini.
  s3:
    image: andrewgaul/s3proxy:s3proxy-4.1.1@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
    environment:
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: appkit
      S3PROXY_CREDENTIAL: appkit-secret
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-15480}:80"
    # Tanpa volume: setiap test membuat dan menghapus bucket-nya sendiri.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 2s
      timeout: 3s
      retries: 30
