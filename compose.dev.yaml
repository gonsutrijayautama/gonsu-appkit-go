# Database untuk `make test`. Port host bawaan 15442; ubah lewat DEV_DB_PORT
# bila bentrok: DEV_DB_PORT=15443 make test.
name: gonsu-appkit-go

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15442}:5432"
    # Tanpa volume: setiap test membuat dan menghapus databasenya sendiri.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
