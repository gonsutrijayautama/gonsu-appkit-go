# CI gonsu-appkit-go.
#
# HANYA runner GitHub, tidak pernah self-hosted: repository ini publik, dan PR
# dari fork dapat menjalankan kode di runner yang dipakainya.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    # Versi runner ditulis terang, bukan `ubuntu-latest`: label itu berpindah
    # ke Ubuntu baru pada jadwal GitHub, dan CI tidak boleh berubah tanpa PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Layanan berbicara S3 untuk test media/s3store; sama dengan
      # compose.dev.yaml. Dikunci ke digest: image pihak ketiga.
      s3:
        image: andrewgaul/s3proxy:s3proxy-4.1.1@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
        env:
          S3PROXY_AUTHORIZATION: aws-v4
          S3PROXY_IDENTITY: appkit
          S3PROXY_CREDENTIAL: appkit-secret
        ports:
          - 15480:80
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
      TEST_S3_ENDPOINT: http://127.0.0.1:15480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Belum di-gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # go.mod dan go.sum harus sudah rapi di commit: produk menarik library
      # ini lewat `go get`, dan go.sum yang tertinggal menggagalkan build-nya.
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Terhadap PostgreSQL dan layanan S3 nyata. Tanpa TEST_DATABASE_URL
      # atau TEST_S3_ENDPOINT test-nya di-skip, jadi langkah ini memastikan
      # tidak satu pun terlewat.
      - name: Test
        run: |
          # Tanpa pipefail, test yang gagal tertutup oleh keberhasilan tee.
          set -o pipefail
          go test -race -count=1 -v ./... | tee "$RUNNER_TEMP/test.log"
          if grep -q -e '^--- SKIP' -e '^    --- SKIP' "$RUNNER_TEMP/test.log"; then
            echo "Ada test yang di-skip; CI harus menjalankan seluruhnya."
            exit 1
          fi
